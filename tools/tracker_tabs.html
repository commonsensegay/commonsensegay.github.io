<style id="csg-tabs-css">

.csg-top nav a{color:#a8b6cc}

.csg-tabs{position:sticky;top:0;z-index:15;margin:0 -16px;padding:10px 16px;background:rgba(12,30,56,.96);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid #27456f}

.csg-tabs button:hover{color:#f4e7c9;border-color:#a8b6cc}
.csg-tabs button[aria-selected="true"]{background:#f5a21f;border-color:#f5a21f;color:#0c1e38}
.csg-tabs button:focus-visible{outline:3px solid #f4e7c9;outline-offset:2px}
.csg-hidden{display:none!important}
#csg-summary .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin:4px 0 6px}

#csg-summary .up{color:var(--up)}

#csg-summary h3{font-family:var(--display);font-size:14px;text-transform:uppercase;letter-spacing:.09em;margin:0 0 6px;color:#0c1e38}
#csg-summary ol{margin:0;padding-left:20px}

/* clean header replaces the original brand header and sunset strip */
body > .wrap > header.brand, body .sky{display:none!important}
.csg-head{position:relative;width:100vw;margin-left:calc(50% - 50vw);margin-top:0;background:radial-gradient(ellipse 90% 80% at 50% 100%,#1d3d6e 0%,#0d1f3a 55%,#081528 100%);overflow:hidden}
.csg-head .hin{max-width:980px;margin:0 auto;padding:40px 16px 8px;position:relative;z-index:2}

.csg-hz .ground{position:absolute;left:0;right:0;bottom:0;height:16px;background:#0c1e38}
.csg-hz .st{position:absolute;color:#f4e7c9;font-size:18px;line-height:1}
@keyframes csgrise{from{transform:translateY(90px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.csg-hz .sun{animation:none}}
body > .csg-top{margin-bottom:0}
.csg-head + .csg-tabs{margin-top:-24px}
.csg-head .pill{display:inline-flex;align-items:center;gap:10px;background:#b8362e;color:#fff6e3;font-family:"Archivo Narrow","Arial Narrow",sans-serif;font-weight:700;font-size:16px;padding:6px 15px 6px 12px;border-radius:999px;margin:0 0 16px}
.csg-head .pill i{width:10px;height:10px;border-radius:50%;background:#ffd27a;box-shadow:0 0 0 4px rgba(255,210,122,.3)}
.csg-head h1{font-family:"Anton",Impact,"Arial Narrow",sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(44px,7vw,84px);line-height:1;letter-spacing:.01em;margin:0 0 14px;color:#f4e7c9;text-shadow:none}
.csg-head p.lede{font-size:clamp(18px,2vw,21px);line-height:1.55;color:#d8dfeb;margin:0;max-width:52ch}

@media (max-width:600px){.csg-head .hin{padding:26px 16px 14px}.csg-hz{height:96px}.csg-hz .st{font-size:14px;top:2px!important}.csg-hz .st:nth-child(2),.csg-hz .st:nth-child(5){display:none}.csg-hz .sun{width:180px;height:180px;margin-left:-90px;bottom:-110px}.csg-hz .stripes i{height:10px;margin-top:8px}.csg-head .pill{font-size:14px;padding:5px 12px 5px 10px}}

body .tile .d .up,body .tile .d .r,body .tile .d .dm{font-weight:600}
body .vrow{font-family:var(--body);font-size:14px}
/* context boxes */
.csg-intro{background:#fbf5e6;color:#1b1d22;border-radius:6px;border-left:6px solid #f5a21f;padding:22px 26px;box-shadow:0 2px 0 rgba(0,0,0,.35)}

.csg-intro p{margin:0 0 10px;font-size:17px;line-height:1.65;max-width:70ch}
.csg-intro p:last-child{margin-bottom:0}
.csg-intro b{color:#0c1e38}
.csg-bottom{background:#fbf5e6;color:#1b1d22;border-radius:6px;padding:30px 32px;border-top:6px solid #b8362e;box-shadow:0 2px 0 rgba(0,0,0,.35)}

.csg-bottom .big{font-family:var(--body);font-size:clamp(21px,2.4vw,27px);line-height:1.45;margin:0 0 18px;color:#0c1e38;max-width:46ch}
.csg-bottom .big b{color:#b8362e}
.csg-bottom .big .dm{color:#2a62b8}

.csg-bottom li.gotv a{color:#ffd27a;font-weight:700;margin-left:4px;white-space:nowrap}
.csg-bottom details.csg-gloss{margin-top:18px;border:0;border-top:1px solid #d6c9a4;padding:14px 0 0;background:transparent}
.csg-bottom .csg-gloss summary{font-family:"Archivo Narrow","Arial Narrow",sans-serif;font-weight:700;font-size:17px;color:#0c1e38;cursor:pointer}
.csg-gloss dl{margin:12px 0 0;display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:8px 18px;font-size:16px;line-height:1.55}
.csg-gloss dt{font-weight:700;color:#0c1e38}
.csg-gloss dd{margin:0;color:#3d3a33}
@media (max-width:600px){.csg-gloss dl{grid-template-columns:1fr}.csg-gloss dd{margin-bottom:6px}.csg-bottom{padding:22px 20px}.csg-intro{padding:18px 18px}}
.csg-swipe{display:none;font-family:"Archivo Narrow","Arial Narrow",sans-serif;font-weight:600;font-size:14px;color:#5f5a4e;margin:0 0 6px}
@media (max-width:820px){.csg-swipe{display:block}}

<script id="csg-tabs-js">
(function(){
  try{
  var wrap=document.querySelector(".wrap"); if(!wrap)return;

  var TABS=[

    {id:"states",label:"By state",match:["state by state","totals only"]},
    {id:"inperson",label:"In person vs mail",match:["in person or mail"]},
    {id:"vs2022",label:"vs 2022 & 2024",match:["against 2022"]},

  // ---- Summary section built from the page's own data
  var sum=null;
  if(typeof SNAPSHOTS!=="undefined"&&SNAPSHOTS.length){
    var reg=(typeof PARTY_REG!=="undefined")?PARTY_REG:new Set();
    var NM=(typeof NAMES!=="undefined")?NAMES:{};
    var calc=function(sn){var o={all:0,ip:0,r:0,d:0,o:0,st:0};for(var ab in sn.states){var a=sn.states[ab];o.all+=a[0];o.ip+=a[4];if(a[0]>0)o.st++;if(reg.has(ab)&&a[1]+a[2]>0){o.stp=(o.stp||0)+1;o.r+=a[1];o.d+=a[2];o.o+=a[3];}}o.h=o.r+o.d+o.o;o.dp=o.h?o.d/o.h*100:0;o.rp=o.h?o.r/o.h*100:0;o.op=o.h?o.o/o.h*100:0;o.m=o.dp-o.rp;return o};
    var cur=SNAPSHOTS[SNAPSHOTS.length-1], prev=SNAPSHOTS.length>1?SNAPSHOTS[SNAPSHOTS.length-2]:null, first=SNAPSHOTS[0];
    var C=calc(cur), P=prev?calc(prev):null, F=calc(first);
    var card=function(t,v,dy,ds){return '<div class="k"><div class="t">'+t+'</div><div class="v">'+v+'</div><div class="d">'+(P?dy+" vs "+fd(prev.date)+"<br>":"")+ds+" since "+fd(first.date)+'</div></div>'};
    var mtxt=function(m){return (m>=0?"D +":"R +")+Math.abs(m).toFixed(1)};
    var toward=function(x){return Math.abs(x)<0.05?"no change":Math.abs(x).toFixed(1)+" pts toward "+(x>0?"D":"R")};
    var grid=card("Ballots returned, all states",n(C.all),P?sg(C.all-P.all,0):"",sg(C.all-F.all,0))
      +card("With a party on record",n(C.h),P?sg(C.h-P.h,0):"",sg(C.h-F.h,0))
      +card("Democratic share",pc(C.dp),P?sg(C.dp-P.dp)+" pts":"",sg(C.dp-F.dp)+" pts")
      +card("Republican share",pc(C.rp),P?sg(C.rp-P.rp)+" pts":"",sg(C.rp-F.rp)+" pts")
      +card("Margin",mtxt(C.m),P?toward(C.m-P.m):"",toward(C.m-F.m))
      +card("In-person ballots",n(C.ip),P?sg(C.ip-P.ip,0):"",sg(C.ip-F.ip,0))
      +card("States reporting",C.st,P?sg(C.st-P.st,0):"",sg(C.st-F.st,0))
      +'<div class="k"><div class="t">Days tracked</div><div class="v">'+(Math.round((Date.parse(cur.date)-Date.parse(first.date))/864e5)+1)+'</div><div class="d">'+SNAPSHOTS.length+' daily pulls since '+fd(first.date)+'</div></div>';
    // movers since each state's first appearance with party data
    var mv=[];
    for(var ab in cur.states){
      var a=cur.states[ab]; if(!(reg.has(ab)&&a[1]+a[2]>0))continue;
      var f=null; for(var i=0;i<SNAPSHOTS.length;i++){var b=SNAPSHOTS[i].states[ab]; if(b&&b[1]+b[2]>0){f={s:SNAPSHOTS[i],a:b};break;}}
      if(!f||f.s===cur)continue;
      var mf=(f.a[2]-f.a[1])/(f.a[1]+f.a[2]+f.a[3])*100, mc=(a[2]-a[1])/(a[1]+a[2]+a[3])*100;

      }
      redder.sort(function(a,b){return a.sh-b.sh}); modeled.sort(function(a,b){return Math.abs(a.m)-Math.abs(b.m)});
      var rl=redder.slice(0,5).map(function(x){return '<li><b>'+(NM[x.ab]||x.ab)+'</b> '+mtxt(x.mn)+' now vs '+mtxt(x.m22)+' at the 2022 finish</li>'}).join("")||'<li>None yet. Every state with enough ballots is running bluer than its 2022 finish, which is normal this early.</li>';

      surpriseHTML='<div class="cols" style="margin:6px 0 14px"><div class="bcard"><h3>Surprises: running redder than 2022</h3><ol>'+rl+'</ol><p class="note" style="margin-top:8px">Most states look bluer than their 2022 finish this early because mail ballots come in first. A state that is already redder than 2022 stands out.</p></div>'
        +(ml?'<div class="bcard"><h3 class="navy">Swing states we can only estimate</h3><ol>'+ml+'</ol><p class="note" style="margin-top:8px">These states don\'t register voters by party, so these are Election Data Guy\'s model estimates, closest races first. '+(modeled.length?(NM[modeled[0].ab]||modeled[0].ab)+' is the closest right now.':'')+'</p></div>':'')+'</div>';
    }catch(e){}
    sum=document.createElement("section"); sum.id="csg-summary";
    sum.innerHTML='<h2>By the numbers</h2><p class="sub">Where things stand after the '+fd(cur.date)+' pull, what changed since yesterday, and how far it has moved since tracking started on '+fd(first.date)+'. Shares and margin use party-registration states only. More states start reporting as early voting opens, so some of the long-run change comes from new states joining, not just voters moving.</p>'
      +'<div class="grid">'+grid+'</div>'
      +'<p class="stamp">Party registration shows who returned a ballot, not how they voted.</p>'
      +surpriseHTML
      +'<div class="cols"><div class="bcard"><h3>Moved most toward Republicans</h3><ol>'+towardR+'</ol></div>'
      +'<div class="bcard"><h3 class="blue">Moved most toward Democrats</h3><ol>'+towardD+'</ol></div>'
      +'<div class="bcard"><h3 class="navy">Most new ballots</h3><ol>'+growth+'</ol></div></div>'
      +'<p class="note">Movers compare each state today with the first pull where it reported party data.</p>';
  }

  // ---- context: plain-English bottom line and per-tab intros
  var INTRO={
    overall:'<p class="lab">What you are looking at</p><p>The big picture, counted two ways. <b>Hard counts</b> use only the 22 or so states that record each voter\'s party, so every number is a real state record. <b>Overall</b> adds estimates for states that don\'t register by party, like Georgia, Michigan, Virginia and Wisconsin. It matches the headline number most trackers quote, but part of it is a model.</p><p>The <b>Dem firewall</b> is how many more Democratic than Republican ballots are already in. It is the lead Republicans have to outvote in person and on Election Day.</p>',
    states:'<p class="lab">What you are looking at</p><p>One row per state, biggest first. <b>Margin</b> is the Democratic share minus the Republican share of ballots that have a party attached. <b>Firewall</b> is the same lead in raw ballots. The small number under a figure is the change since the previous day\'s pull; 0 means the state posted no new file.</p><p>The first table is states that record party. The second is estimates for states that don\'t. The last list is states that report totals only.</p>',
    inperson:'<p class="lab">What you are looking at</p><p>How people are voting, not just who. Democrats lean toward voting by mail early, Republicans toward voting in person. In 2022 the mail vote ran about D 46 to R 31, and in-person early voting ran about R 40 to D 34.</p><p>So the Democratic lead is usually biggest at the start and shrinks as in-person voting opens state by state. This tab shows when each state opens and how many ballots have come in each way.</p>',
    vs2022:'<p class="lab">What you are looking at</p><p>The yardstick. When early voting ended in 2022, ballots with a party on record ran <b>Democrats 42.5%, Republicans 33.8%</b>, a Democratic lead of about 8.7 points.</p><p>If this year finishes with a smaller Democratic lead than that, Republicans are running ahead of their last midterm. Keep in mind this compares an early read to a finished result, since no same-day 2022 snapshot exists.</p>',

    sources:'<p class="lab">What you are looking at</p><p>Where every number comes from and how we check it. The state counts come from each state\'s returned-ballot files via Election Data Guy, cross-checked against Dr. Michael McDonald\'s University of Florida Election Lab. The 2022 baseline is from the US Elections Project.</p>'
  };
  var bottom=null;
  if(typeof SNAPSHOTS!=="undefined"&&SNAPSHOTS.length&&typeof C!=="undefined"){

    var days=Math.max(1,Math.round((Date.parse(cur.date)-Date.parse(first.date))/864e5));

    var gainTxt=perDay<-0.05?'<b>Republicans are gaining about '+Math.abs(perDay).toFixed(2).replace(/0$/,"")+' points a day.</b> The Democratic lead has dropped '+Math.abs(C.m-F.m).toFixed(1)+' points in '+days+' days, from '+mtxt(F.m)+' to '+mtxt(C.m)+(P?(C.m<P.m?', and moved another '+Math.abs(C.m-P.m).toFixed(1)+' toward Republicans since yesterday.':'.'):'.')
      :perDay>0.05?'<b>Democrats are gaining about '+perDay.toFixed(2).replace(/0$/,"")+' points a day</b> since '+fd(first.date)+'.':'';
    var fwTxt=(fwC>=0&&fwF>=0)?'<b>The firewall is growing, the lead is shrinking.</b> Democrats\' raw ballot lead went from '+n(fwF)+' to '+n(fwC)+' since '+fd(first.date)+', about '+(fwC>=fwF?'+':'')+n(Math.round((fwC-fwF)/days))+' a day. It grows because more people are voting, but as a share of all ballots the Democratic edge '+(C.m<F.m?'keeps getting smaller':'is holding')+'.':'';
    bottom=document.createElement("div"); bottom.className="csg-bottom"; bottom.setAttribute("data-tab","summary");
    bottom.innerHTML='<p class="lab">The bottom line, as of '+fd(cur.date)+'</p>'
      +'<p class="big">About <b>'+millions+' million</b> Americans have already voted. In the '+C.stp+' states that track party, registered Democrats cast <span class="dm">'+per(C.dp)+'</span> of every 100 ballots and registered Republicans cast <b>'+per(C.rp)+'</b>. '+lead+', '+trend+' when tracking started on '+fd(first.date)+'. '+who+'</p>'
      +'<ul>'
      +'<li class="gotv"><b>Republicans, vote early.</b> We\'ve long saved our vote for Election Day, which is why Democrats lead right now. If you don\'t trust mail ballots, vote early in person. We\'ll swamp Election Day, but we can\'t afford to miss a single vote, so if you can vote early, do it, and bring your friends and family. <a href="/vote/">Find your early voting dates</a></li>'
      +(gainTxt?'<li>'+gainTxt+'</li>':'')
      +(fwTxt?'<li>'+fwTxt+'</li>':'')
      +'<li><b>This is who voted, not how they voted.</b> A registered Democrat can vote Republican and the reverse. Party registration is the best early signal states publish.</li>'
      +'<li><b>The 2022 yardstick.</b> Early voting finished 2022 at about <b>D +8.7</b>. A Democratic lead that ends smaller than that is good news for Republicans.</li></ul>'
      +'<details class="csg-gloss"><summary>What the terms mean</summary><dl>'
      +'<dt>Hard count</dt><dd>A real number from a state that records each voter\'s party. Nothing estimated.</dd>'
      +'<dt>Modeled</dt><dd>An estimate for states that don\'t register voters by party, based on Election Data Guy\'s model.</dd>'
      +'<dt>Margin</dt><dd>Democratic share minus Republican share of ballots with a party attached. D +25.7 means Democrats are 25.7 points ahead.</dd>'
      +'<dt>Firewall</dt><dd>The Democratic lead in raw ballots. Republicans need to beat it on Election Day.</dd>'
      +'<dt>Other / no party</dt><dd>Independents, third parties and voters with no party on file.</dd>'
      +'<dt>Pull</dt><dd>One daily download of every state\'s file, around 10 AM Central.</dd></dl></details>';
  }
  // ---- assign sections to tabs
  var map={}; TABS.forEach(function(t){map[t.id]=[]});
  secs.forEach(function(s){
    var h=title(s), hit=null;
    TABS.forEach(function(t){ if(!hit&&t.match.some(function(m){return h.indexOf(m)===0||h.indexOf(m)>-1})) hit=t.id; });
    if(!hit)hit="overall"; s.setAttribute("data-tab",hit); map[hit].push(s);
  });
  if(sum&&secs.length){ var firstSum=map.summary[0]||secs[0]; firstSum.parentNode.insertBefore(sum,firstSum); sum.setAttribute("data-tab","summary"); map.summary.unshift(sum); }
  Object.keys(INTRO).forEach(function(id){ if(!map[id]||!map[id].length)return; var d=document.createElement("div"); d.className="csg-intro"; d.setAttribute("data-tab",id); d.innerHTML=INTRO[id]; map[id][0].parentNode.insertBefore(d,map[id][0]); map[id].unshift(d); });
  if(bottom&&map.summary.length){ map.summary[0].parentNode.insertBefore(bottom,map.summary[0]); map.summary.unshift(bottom); }
  var tabs=TABS.filter(function(t){return map[t.id].length});
  var nav=document.createElement("div"); nav.className="csg-tabs";

  var head=document.createElement("div"); head.className="csg-head";
  var lastPull=(typeof SNAPSHOTS!=="undefined"&&SNAPSHOTS.length)?SNAPSHOTS[SNAPSHOTS.length-1].pulled:"";
  head.innerHTML='<p class="pill"><i aria-hidden="true"></i>Updated every morning'+(lastPull?' · '+lastPull.replace(/^([A-Za-z]+ \d+), \d{4},/,"$1,"):'')+'</p>'
    +'<h1>Early vote tracker 2026</h1>'
    +'<p class="lede">Who has already voted in the November 3 midterm, by the party they\'re registered with. Not how they voted, just who showed up.</p>';
  head.innerHTML='<div class="hin">'+head.innerHTML+'</div><div class="csg-hz" aria-hidden="true"><span class="st" style="left:7%;top:6px">★</span><span class="st" style="left:18%;top:20px">★</span><span class="st" style="left:29%;top:8px">★</span><span class="st" style="right:29%;top:8px">★</span><span class="st" style="right:18%;top:20px">★</span><span class="st" style="right:7%;top:6px">★</span><div class="sun"></div><div class="stripes"><i></i><i></i><i></i></div><div class="ground"></div></div>';
  var anchor=secs[0]; anchor.parentNode.insertBefore(head,map[tabs[0].id][0]); anchor.parentNode.insertBefore(nav,map[tabs[0].id][0]);
  var allSecs=[].slice.call(wrap.querySelectorAll(":scope > [data-tab]"));
  function show(id,push){
    if(!map[id]||!map[id].length)id=tabs[0].id;

    swipeHints();

  function swipeHints(){ [].slice.call(document.querySelectorAll(".scroll")).forEach(function(sc){ if(sc.offsetParent===null)return; var has=sc.previousElementSibling&&sc.previousElementSibling.classList.contains("csg-swipe"); if(sc.scrollWidth>sc.clientWidth+8&&!has){var h=document.createElement("p");h.className="csg-swipe";h.textContent="Swipe sideways to see every column";sc.parentNode.insertBefore(h,sc);} }); }

  });
  // ---- Same day: North Carolina 2022 vs 2024 vs 2026
  fetch("/data/nc-sameday.json",{cache:"no-cache"}).then(function(r){return r.ok?r.json():null}).then(function(d){
    if(!d||!d.years||!d.years["2026"]||!map.vs2022||!map.vs2022.length)return;
    var Y=d.years, cur26=Y["2026"].series[Y["2026"].series.length-1], k=cur26.out;
    var at=function(y){var s=Y[y]&&Y[y].series;if(!s)return null;for(var i=0;i<s.length;i++)if(s[i].out===k)return s[i];return null};
    var a22=at("2022"), a24=at("2024");
    var mt=function(m){return m==null?"n/a":(m>=0?"D +":"R +")+Math.abs(m).toFixed(1)};
    var pc2=function(x,t){return t?(x/t*100).toFixed(1)+"%":"n/a"};
    var row=function(y,o,bold){return '<tr'+(bold?' style="font-weight:700"':'')+'><td>'+y+'</td><td>'+fd(o.date)+'</td><td>'+n(o.total)+'</td><td>'+pc2(o.D,o.total)+'</td><td>'+pc2(o.R,o.total)+'</td><td><span class="'+(o.margin>=0?'dm':'r')+'">'+mt(o.margin)+'</span></td><td>'+n(o.inperson)+'</td></tr>'};
    var cmp=function(o,y){if(!o)return "";var x=cur26.margin-o.margin;return Math.abs(x)<0.5?"about even with "+y:Math.abs(x).toFixed(1)+" points "+(x<0?"more Republican":"more Democratic")+" than "+y};
    var take='<b>'+k+' days before Election Day, North Carolina 2026 is running '+[cmp(a22,"2022"),cmp(a24,"2024")].filter(Boolean).join(" and ")+'</b> at the same point.';
    // chart: margin by days out
    var W=720,H=300,L=46,R=14,T=16,B=36,maxOut=40;
    var xs=function(o){return L+(maxOut-o)/maxOut*(W-L-R)}, ys=function(m){return T+(40-Math.max(-15,Math.min(40,m)))/55*(H-T-B)};
    var line=function(y,color,w){var s=Y[y]&&Y[y].series;if(!s)return "";var pts=s.filter(function(p){return p.out<=maxOut&&p.margin!=null&&p.total>=500}).map(function(p){return xs(p.out).toFixed(1)+","+ys(p.margin).toFixed(1)});return '<polyline fill="none" stroke="'+color+'" stroke-width="'+w+'" stroke-linejoin="round" points="'+pts.join(" ")+'"/>'};
    var grid="";[40,30,20,10,0,-10].forEach(function(m){grid+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+ys(m)+'" y2="'+ys(m)+'" stroke="'+(m===0?'#8a8170':'#ddd0ae')+'" stroke-width="'+(m===0?1.5:1)+'"/><text x="'+(L-8)+'" y="'+(ys(m)+4)+'" text-anchor="end" font-size="12" fill="#5f5a4e">'+(m===0?"Even":(m>0?"D +":"R +")+Math.abs(m))+'</text>'});
    [40,30,20,10,0].forEach(function(o){grid+='<text x="'+xs(o)+'" y="'+(H-12)+'" text-anchor="'+(o===0?"end":o===40?"start":"middle")+'" font-size="12" fill="#5f5a4e">'+(o===0?"Election Day":o+" days out")+'</text>'});
    var today='<line x1="'+xs(k)+'" x2="'+xs(k)+'" y1="'+T+'" y2="'+(H-B)+'" stroke="#b8362e" stroke-dasharray="4 4"/><circle cx="'+xs(k)+'" cy="'+ys(cur26.margin)+'" r="5" fill="#b8362e"/>';
    var svg='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="North Carolina Democratic margin among early ballots by days before Election Day, 2022, 2024 and 2026" style="width:100%;height:auto;display:block">'+grid+line("2022","#9a958a",2.5)+line("2024","#2a62b8",2.5)+line("2026","#b8362e",4)+today+'</svg>';
    var sec=document.createElement("section"); sec.setAttribute("data-tab","vs2022"); sec.id="csg-sameday";
    sec.innerHTML='<h2>Same day: North Carolina 2022, 2024, 2026</h2>'
      +'<p class="note">The fair comparison: where each election stood on the same number of days before Election Day. North Carolina publishes every ballot with the date it came back and the voter\'s party, so these are exact counts, not estimates.</p>'
      +'<div class="flag" style="max-width:none"><p style="margin:0">'+take+'</p></div>'
      +'<div class="scroll"><table><tr><th>Year</th><th>Same day</th><th>Ballots in</th><th>Dem %</th><th>Rep %</th><th>Margin</th><th>In person</th></tr>'
      +(a22?row("2022",a22):"")+(a24?row("2024",a24):"")+row("2026",cur26,true)+'</table></div>'
      +'<div style="margin-top:14px">'+svg+'</div>'
      +'<div class="legend"><span><b style="background:#9a958a"></b>2022 midterm</span><span><b style="background:#2a62b8"></b>2024 presidential</span><span><b style="background:#b8362e"></b>2026 so far</span></div>'
      +'<p class="note">Watch what happens when in-person early voting opens: in both 2022 and 2024 the Democratic lead fell fast once it started, and in 2024 Republicans took the lead about 10 days out. North Carolina early in-person voting opens Oct 15. Counts are accepted ballots by return date from the <a href="https://dl.ncsbe.gov/?prefix=ENRS/">NC State Board of Elections</a>; 2026 updates each morning.</p>';
    var first=map.vs2022[0]; var anchorEl=map.vs2022.length>1?map.vs2022[1]:first;
    anchorEl.parentNode.insertBefore(sec,anchorEl);
    map.vs2022.splice(1,0,sec); allSecs.push(sec);
    var active=nav.querySelector('button[aria-selected="true"]');
    sec.classList.toggle("csg-hidden",!(active&&active.dataset.t==="vs2022"));
    // add a line to the summary bottom line
    var ul=document.querySelector(".csg-bottom ul");
    if(ul){var li=document.createElement("li");li.innerHTML='<b>Same day in North Carolina:</b> '+take.replace(/<\/?b>/g,"")+' <a href="#vs2022" onclick="document.getElementById(\'tab-vs2022\').click();return false">See the chart</a>';ul.insertBefore(li,ul.children[2]||null);}
  }).catch(function(){});
  show((location.hash||"").slice(1),false);
  window.addEventListener("hashchange",function(){show((location.hash||"").slice(1),false)});
  }catch(err){ if(window.console)console.warn("tabs",err); }
})();
